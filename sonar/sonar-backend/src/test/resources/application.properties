spring.application.name=sonar-backend

# Database
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=sa

# Mqtt Integration
mqtt.server.uri=tcp://localhost:1883
mqtt.communication.timeout.millis=50000

# CORS (Cross-Origin Resource Sharing) Allowed Origin is a mechanism that allows a server to specify which origins are allowed to access its resources.
cors.allowed.origin.sonar.frontend.url=${CORS_ALLOWED_ORIGINS_SONAR_FRONTEND_URL:http://localhost:3000}